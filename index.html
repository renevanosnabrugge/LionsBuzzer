<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Lions Buzzer</title>
<style>
  :root {
    --bg: #111;
    --panel: #1c1c1c;
    --text: #f5f5f5;
    --muted: #9a9a9a;
    --gold: #ffb81c;
    --red: #e3242b;
    --green: #2ecc71;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 20px;
    transition: background-color .1s;
  }
  body.flash { background: var(--red); }
  h1 {
    margin: 4px 0 0;
    font-size: 1.4rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: clamp(5rem, 28vw, 14rem);
    line-height: 1;
  }
  .status { color: var(--muted); min-height: 1.4em; text-align: center; }
  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label { font-size: .9rem; color: var(--muted); display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button { flex: 1 1 0; min-width: 60px; }
  input[type=number] {
    width: 100%;
    font-size: 1.6rem;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid #333;
    background: #000;
    color: var(--text);
    text-align: center;
  }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    padding: 12px;
    background: #2a2a2a;
    color: var(--text);
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button.selected { background: var(--gold); color: #000; }
  .big {
    width: 100%;
    max-width: 520px;
    font-size: 2rem;
    padding: 22px;
    letter-spacing: .1em;
  }
  #startBtn { background: var(--green); color: #000; }
  #startBtn.running { background: #000; color: #fff; border: 3px solid var(--red); }
  #buzzBtn { background: var(--gold); color: #000; }
  .hint { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
  <h1>🦁 Lions Buzzer</h1>

  <div class="clock" id="clock">0:30</div>
  <div class="status" id="status">Klaar · druk op START</div>

  <button class="big" id="startBtn">START</button>
  <button class="big" id="buzzBtn">BUZZ!</button>

  <div class="panel">
    <div>
      <label for="interval">Interval (seconden)</label>
      <input type="number" id="interval" min="1" max="3600" value="30" inputmode="numeric">
    </div>
    <div class="row presets" id="presets">
      <button data-s="30">30s</button>
      <button data-s="60">1 min</button>
      <button data-s="90">1:30</button>
      <button data-s="120">2 min</button>
      <button data-s="180">3 min</button>
    </div>
    <div>
      <label for="duration">Buzzer lengte: <span id="durationVal">2.0</span> s</label>
      <input type="range" id="duration" min="0.5" max="5" step="0.5" value="2">
    </div>
    <div>
      <label for="volume">Volume: <span id="volumeVal">100</span>%</label>
      <input type="range" id="volume" min="10" max="100" step="5" value="100">
    </div>
    <div>
      <label for="soundFile">Eigen geluid (optioneel, mp3/wav)</label>
      <input type="file" id="soundFile" accept="audio/*">
    </div>
  </div>

  <p class="hint">Spatie = start/stop · B = buzz · Zet je telefoon/speaker op max volume</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const clockEl = $('clock'), statusEl = $('status');
  const startBtn = $('startBtn'), buzzBtn = $('buzzBtn');
  const intervalEl = $('interval'), durationEl = $('duration'), volumeEl = $('volume');

  let ctx = null;
  let customBuffer = null;
  let running = false;
  let nextBuzzAt = 0;
  let tickTimer = null;
  let wakeLock = null;
  let buzzCount = 0;

  // ---------- Settings (remembered in this browser) ----------
  try {
    const saved = JSON.parse(localStorage.getItem('lionsBuzzer') || '{}');
    if (saved.interval) intervalEl.value = saved.interval;
    if (saved.duration) durationEl.value = saved.duration;
    if (saved.volume) volumeEl.value = saved.volume;
  } catch (e) {}

  function save() {
    try {
      localStorage.setItem('lionsBuzzer', JSON.stringify({
        interval: intervalEl.value, duration: durationEl.value, volume: volumeEl.value
      }));
    } catch (e) {}
  }

  function intervalSeconds() {
    const v = Math.round(Number(intervalEl.value));
    return Math.min(3600, Math.max(1, isFinite(v) && v > 0 ? v : 30));
  }

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

  function updateLabels() {
    $('durationVal').textContent = Number(durationEl.value).toFixed(1);
    $('volumeVal').textContent = volumeEl.value;
    document.querySelectorAll('#presets button').forEach(b =>
      b.classList.toggle('selected', Number(b.dataset.s) === intervalSeconds()));
    if (!running) clockEl.textContent = fmt(intervalSeconds());
  }

  // ---------- Audio ----------
  function ensureAudio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Soft-clipping curve to make the horn gritty and loud like an arena buzzer.
  function distortionCurve(amount) {
    const n = 2048, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((1 + amount) * x) / (1 + amount * Math.abs(x));
    }
    return curve;
  }

  // Synthesized arena horn: a stack of detuned sawtooth/square tones,
  // overdriven and compressed for maximum perceived loudness.
  function playHorn(duration, volume) {
    const ac = ensureAudio();
    const t0 = ac.currentTime + 0.01;
    const t1 = t0 + duration;

    const master = ac.createGain();
    master.gain.setValueAtTime(0, t0);
    master.gain.linearRampToValueAtTime(volume, t0 + 0.03);
    master.gain.setValueAtTime(volume, t1);
    master.gain.linearRampToValueAtTime(0, t1 + 0.12);

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 6;
    comp.ratio.value = 12;
    comp.attack.value = 0.003;
    comp.release.value = 0.1;

    const shaper = ac.createWaveShaper();
    shaper.curve = distortionCurve(30);
    shaper.oversample = '4x';

    const tone = ac.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 4000;

    const presence = ac.createBiquadFilter();
    presence.type = 'peaking';
    presence.frequency.value = 1200;
    presence.Q.value = 0.8;
    presence.gain.value = 6;

    const pre = ac.createGain();
    pre.gain.value = 0.35;

    pre.connect(shaper).connect(tone).connect(presence).connect(comp).connect(master).connect(ac.destination);

    // Root + fifth + octave, slightly detuned for a thick, nasty buzz.
    const voices = [
      [110, 'sawtooth', 0], [110, 'square', 7],
      [165, 'sawtooth', -5], [220, 'sawtooth', 4],
      [220, 'square', -8], [330, 'sawtooth', 3]
    ];
    voices.forEach(([f, type, cents]) => {
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.value = f;
      o.detune.value = cents;
      o.connect(pre);
      o.start(t0);
      o.stop(t1 + 0.15);
    });
  }

  function playCustom(duration, volume) {
    const ac = ensureAudio();
    const src = ac.createBufferSource();
    src.buffer = customBuffer;
    const g = ac.createGain();
    const t0 = ac.currentTime + 0.01;
    g.gain.setValueAtTime(volume, t0);
    src.connect(g).connect(ac.destination);
    src.start(t0);
    // Respect buzzer length only if the file is longer.
    if (customBuffer.duration > duration) {
      g.gain.setValueAtTime(volume, t0 + duration);
      g.gain.linearRampToValueAtTime(0, t0 + duration + 0.1);
      src.stop(t0 + duration + 0.12);
    }
  }

  function buzz() {
    const duration = Number(durationEl.value);
    const volume = Number(volumeEl.value) / 100;
    if (customBuffer) playCustom(duration, volume); else playHorn(duration, volume);
    if (navigator.vibrate) navigator.vibrate(duration * 1000);
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), duration * 1000);
  }

  $('soundFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) { customBuffer = null; return; }
    try {
      const data = await file.arrayBuffer();
      customBuffer = await ensureAudio().decodeAudioData(data);
      statusEl.textContent = 'Eigen geluid geladen: ' + file.name;
    } catch (err) {
      customBuffer = null;
      statusEl.textContent = 'Kon dit geluidsbestand niet lezen';
    }
  });

  // ---------- Timer ----------
  // Deadline-based so it doesn't drift, even if the browser throttles timers.
  function tick() {
    const now = performance.now();
    if (now >= nextBuzzAt) {
      buzz();
      buzzCount++;
      const step = intervalSeconds() * 1000;
      while (nextBuzzAt <= now) nextBuzzAt += step;
      statusEl.textContent = 'Loopt · buzz #' + buzzCount;
    }
    clockEl.textContent = fmt((nextBuzzAt - now) / 1000);
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }

  function start() {
    ensureAudio();
    running = true;
    buzzCount = 0;
    nextBuzzAt = performance.now() + intervalSeconds() * 1000;
    tickTimer = setInterval(tick, 100);
    tick();
    startBtn.textContent = 'STOP';
    startBtn.classList.add('running');
    statusEl.textContent = 'Loopt · buzz elke ' + fmt(intervalSeconds());
    requestWakeLock();
  }

  function stop() {
    running = false;
    clearInterval(tickTimer);
    startBtn.textContent = 'START';
    startBtn.classList.remove('running');
    statusEl.textContent = 'Gestopt';
    clockEl.textContent = fmt(intervalSeconds());
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  startBtn.addEventListener('click', () => running ? stop() : start());
  buzzBtn.addEventListener('click', buzz);

  document.querySelectorAll('#presets button').forEach(b =>
    b.addEventListener('click', () => {
      intervalEl.value = b.dataset.s;
      intervalEl.dispatchEvent(new Event('input'));
    }));

  intervalEl.addEventListener('input', () => {
    updateLabels(); save();
    if (running) nextBuzzAt = performance.now() + intervalSeconds() * 1000;
  });
  [durationEl, volumeEl].forEach(el => el.addEventListener('input', () => { updateLabels(); save(); }));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.code === 'Space') { e.preventDefault(); running ? stop() : start(); }
    else if (e.key === 'b' || e.key === 'B') buzz();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  updateLabels();
})();
</script>
</body>
</html>
