name: Report a problem
description: Something in the buzzer doesn't work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping to improve the buzzer! Opened from the app? Then the technical details below are already filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong. A screenshot helps a lot.
      placeholder: "The buzzer stopped making sound after the second interval."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "A buzz at every interval."
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: The steps you took, if you know them.
      placeholder: |
        1. Choose team Dordrecht Lions
        2. Set interval to 1:00
        3. Start the clock and lock the screen
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPad
        - iPhone
        - Android tablet
        - Android phone
        - Laptop / computer
        - Other
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Technical details
      description: Filled in automatically when you report from the app (Help or About → Report a problem).
      render: text
    validations:
      required: false
